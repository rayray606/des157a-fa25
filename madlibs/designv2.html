<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Design Version 2</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Text:ital@0;1&family=Outfit:wght@100..900&display=swap" rel="stylesheet">

<script src="script.js" defer></script>

<style>
body {
background-color: #fffbe7;
font-family: "DM Serif Text", serif;
}

.textbox { 
position: relative;
border: 10px solid rgb(90, 63, 62);
background-color: #f7ffbe;
width: 900px;
padding: 60px 20px;
margin: 150px auto;
text-align: center;
border-radius: 16px;
box-shadow: 0 6px 20px rgba(0,0,0,0.15);
}

.textbox img {
position: absolute;
width: 100px;
height: auto;
}

.chiikawa {
top: -50px;
left: -50px;
}

.hachiware {
top: -50px;
right: -50px;
}

.momonga {
bottom: -50px;
left: -50px;
}

.usagi {
bottom: -50px;
right: -50px;
}

button {
margin-top: 20px;
padding: 10px 20px;
font-size: 1rem;
border-radius: 10px;
border: none;
background-color: rgb(90, 63, 62);
color: #fff;
cursor: pointer;
}

button:hover {
background-color: #a4b365;
}
  
</style>
</head>

<body>
  <div class="textbox">
    <img src="images/chiikawa.PNG" class="chiikawa">
    <img src="images/hachiware.PNG" class="hachiware">
    <img src="images/momonga.PNG" class="momonga">
    <img src="images/usagi.PNG" class="usagi">

    <h1>Help Chiikawa make a wishlist!</h1>
    <p>Fill in the blanks below:</p>

  <input class="adj1" type="text" placeholder="Adjective">
  <input class="adj2" type="text" placeholder="Adjective">
  <input class="adj3" type="text" placeholder="Adjective">
  <input class="adj4" type="text" placeholder="Adjective">
  <input class="verb1" type="text" placeholder="Verb-ing">
  <input class="verb2" type="text" placeholder="Verb-ing">
  <input class="verb3" type="text" placeholder="Verb-ing">
  <input class="noun" type="text" placeholder="Noun">
  <input class="food" type="text" placeholder="Food noun">
  <input class="present" type="text" placeholder="Present">
  <input class="adverb" type="text" placeholder="Adverb">

  <br>
  <button class="start">Start!</button>

  <div id="story"></div>
</div>

</html>
